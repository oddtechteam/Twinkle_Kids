# Local development services only. Credentials here are throwaway local values,
# never used for staging/production (those come from Neon via DATABASE_URL).
services:
  db:
    image: postgres:17-alpine
    container_name: twinkle-kids-db
    environment:
      POSTGRES_USER: twinkle
      POSTGRES_PASSWORD: twinkle
      POSTGRES_DB: twinkle_kids
    ports:
      - "5433:5432"  # host 5433 avoids clashing with a locally installed Postgres
    volumes:
      - twinkle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twinkle -d twinkle_kids"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  twinkle_pgdata:
